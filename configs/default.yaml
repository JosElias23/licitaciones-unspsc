# Single source of truth for every parameter that affects a reported number.

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  # Months to crawl. Split is temporal, so these are listed oldest first and the
  # cutoff below decides which side each tender falls on.
  months:
    - [2026, 1]
    - [2026, 2]
    - [2026, 3]
    - [2026, 4]
  tenders_per_month: 1500
  # Everything published before this date trains, everything after is held out.
  # A random split would let the model see later phrasing while predicting
  # earlier tenders, which is not the situation it faces in use.
  split_cutoff: "2026-04-01"
  # Segments with fewer than this many training examples are folded into an
  # "other" class. With 40+ segments and a long tail, the rare ones cannot be
  # learned or evaluated, and leaving them in inflates the apparent class count
  # without adding signal.
  min_segment_count: 25

features:
  # The ONLY text the model may see. The item description is the UNSPSC taxonomy
  # path in Spanish and is therefore the label; see src/licitaciones/data.py.
  text_fields: [title, description]
  lowercase: true
  strip_accents: true

baselines:
  tfidf:
    max_features: 50000
    ngram_range: [1, 2]
    min_df: 2
    sublinear_tf: true
  linear_svc:
    C: 1.0
    class_weight: balanced
  gradient_boosting:
    n_estimators: 400
    learning_rate: 0.1
    max_depth: 6

# Fine-tuned Spanish encoder. Titles are eight words long, so max_length is small
# and batches can be large; this trains in a couple of minutes on one consumer GPU.
encoder:
  model_name: dccuchile/bert-base-spanish-wwm-cased    # BETO
  max_length: 64
  # Chosen on a validation month (March), never on the held-out test month.
  # The earlier value of 15 came from scoring 6/15/30 on April and keeping the
  # best, which is selection on the test set; scripts/select_epochs.py redoes
  # the choice honestly and validation accuracy rises monotonically to 30.
  # See docs/DECISIONS.md section 6.1.
  num_epochs: 30
  batch_size: 32
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1

llm:
  # Local model, so the repository costs nothing to reproduce and no key leaves
  # the machine.
  provider: ollama
  # An IP literal, not "localhost", and that is not a style preference. On this
  # machine localhost resolves to ::1 first while Ollama binds IPv4 only, so
  # every urllib call waited ~2,054 ms for the IPv6 connection to be refused
  # before falling back. That artefact sat inside every published per-tender
  # latency until scripts/measure_llm_overhead.py isolated it.
  base_url: http://127.0.0.1:11434
  model: qwen2.5:7b-instruct
  temperature: 0.0
  max_tokens: 64
  timeout_seconds: 120

evaluation:
  # Bootstrap over test tenders, for confidence intervals on every comparison.
  n_bootstrap: 5000

paths:
  reports_dir: reports
  figures_dir: reports/figures
  duckdb: data/processed/licitaciones.duckdb
