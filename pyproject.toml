[project]
name = "licitaciones-unspsc"
version = "0.1.0"
description = "Predicting UNSPSC procurement categories from the free-text titles of Chilean public tenders, and asking whether a local LLM earns its compute against a linear model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jose Elias Sanhueza Perez" }]

dependencies = [
    "duckdb>=1.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
llm = ["dspy>=3.0"]                  # scripts/run_llm_variants.py
encoder = [                          # scripts/run_encoder.py
    "torch>=2.0",
    "transformers>=4.44,<5",
    "huggingface-hub>=0.34,<1.0",    # transformers<5 rejects hub>=1.0
    "accelerate>=0.33",
]
serving = [                          # scripts/run_quantisation.py
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",               # torch>=2.9 needs it even for dynamo=False imports
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
